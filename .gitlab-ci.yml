spec:
  inputs:
    rotate_token:
      type: boolean
      default: false
      description: "Set to true to rotate the Renovate access token"
---

include:
  - project: 'renovate-bot/renovate-runner'
    file: '/templates/renovate.gitlab-ci.yml'
    ref: v26.0.0

variables:
  RENOVATE_EXTRA_FLAGS: '--autodiscover=true --autodiscover-filter=haproxy-haptic/*'

# Opt this project into MR-event pipelines. The upstream renovate job is
# gated on `$CI_PIPELINE_SOURCE == "schedule"` only (see the
# renovate-bot/renovate-runner README: "By default our pipeline only runs
# on schedules"). GitLab's MR-pipeline contract requires a rule matching
# `merge_request_event` to live in the project's own .gitlab-ci.yml —
# rules supplied through `include:` do not count. Without this override,
# renovate-bot bump MRs never produce a pipeline, so the group-level
# `Pipelines must succeed` gate deadlocks `platformAutomerge` (configured
# in default.json) and bumps accumulate open.
renovate:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# Monthly token rotation to prevent expiration
rotate-token:
  stage: .pre
  image: curlimages/curl:latest
  rules:
    - if: '"$[[ inputs.rotate_token ]]" == "true"'
  script:
    - |
      # Self-rotate using the API (requires api or self_rotate scope).
      # GitLab defaults expires_at to 7 days when omitted, so we must set it
      # explicitly — otherwise each monthly rotation issues a token that
      # silently dies a week later.
      EXPIRES_AT=$(date -u -d '+90 days' +%Y-%m-%d)
      RESPONSE=$(curl --silent --fail --request POST \
        --header "PRIVATE-TOKEN: ${RENOVATE_TOKEN}" \
        --form "expires_at=${EXPIRES_AT}" \
        "${CI_API_V4_URL}/groups/haproxy-haptic/access_tokens/self/rotate")

      NEW_TOKEN=$(echo "${RESPONSE}" | sed 's/.*"token":"\([^"]*\)".*/\1/')

      if [ -z "$NEW_TOKEN" ] || [ "$NEW_TOKEN" = "$RESPONSE" ]; then
        echo "ERROR: Failed to extract token from response"
        exit 1
      fi

      echo "New token expires at ${EXPIRES_AT}"

      # Update the CI/CD variable with the new token
      curl --silent --fail --request PUT \
        --header "PRIVATE-TOKEN: ${NEW_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/variables/RENOVATE_TOKEN" \
        --form "value=${NEW_TOKEN}" \
        --form "masked=true"

      echo "Token rotated successfully"
